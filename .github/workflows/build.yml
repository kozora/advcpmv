name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADVCPMV_VERSION: 0.9
      CORE_UTILS_VERSION: 9.5

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl patch

    - name: Apply Patch
      run: |
        cd coreutils-$CORE_UTILS_VERSION
        # Use the patch file from the checked-out repository
        patch -p1 -i ../advcpmv-$ADVCPMV_VERSION-$CORE_UTILS_VERSION.patch

    - name: Configure
      run: |
        cd coreutils-$CORE_UTILS_VERSION
        ./configure --quiet

    - name: Make
      run: |
        cd coreutils-$CORE_UTILS_VERSION
        make -j$(nproc)

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp coreutils-$CORE_UTILS_VERSION/src/cp artifacts/advcp
        cp coreutils-$CORE_UTILS_VERSION/src/mv artifacts/advmv

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: advcpmv-binaries
        path: artifacts/
